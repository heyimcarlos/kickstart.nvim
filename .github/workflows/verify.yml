name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          version: v0.12.4
          neovim: true

      - name: Set up Stylua
        uses: taiki-e/install-action@v2
        with:
          tool: stylua

      - name: Cache Neovim data
        uses: actions/cache@v4
        with:
          path: ~/.local/share/nvim
          key: ${{ runner.os }}-neovim-${{ hashFiles('lazy-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-neovim-

      - name: Synchronize plugins
        run: nvim --headless -u init.lua "+Lazy! sync" +qa

      - name: Verify
        run: ./scripts/check
